<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forza Livery Repository</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>LIVERY ARCHIVE</h1>
        <p style="color: var(--text-dim)">Premium Designs for the Forza Horizon Series</p>
    </header>

    <div class="filter-container">
        <div class="search-controls">
            <input type="text" id="filter-make" list="makes-list" placeholder="Filter by Make...">
            <datalist id="makes-list"></datalist>
            
            <input type="text" id="filter-year" list="years-list" placeholder="Year...">
            <datalist id="years-list"></datalist>

            <select id="filter-drive">
                <option value="">All Drivetrains</option>
                <option value="FWD">FWD</option>
                <option value="RWD">RWD</option>
                <option value="AWD">AWD</option>
            </select>

            <div class="tag-input-wrapper">
                <input type="text" id="filter-tag-input" list="tags-list" placeholder="Add Tag...">
                <datalist id="tags-list"></datalist>
            </div>
        </div>
        <div class="filter-tags" id="filter-bar">
            <!-- Active tag chips will appear here -->
        </div>
    </div>

    <main class="gallery" id="gallery">
    </main>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
        window.onload = () => {
            window.renderGallery();
        };
    </script>
</body>
</html>
